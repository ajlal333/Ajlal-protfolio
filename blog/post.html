<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181818" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LogicFolds</title>
  </head>
  <!--
    Build shell, not a page.

    Vite builds this so the blog's stylesheet and script get hashed filenames.
    scripts/build-blog-shell.mjs then lifts the asset tags and the nav / footer /
    booking dialog out of the built copy into lib/blog-shell.generated.mjs,
    and deletes this file from dist. The Netlify Functions that serve /blog/ and
    /blog/posts/<slug>/ import that shell, so editing the nav here updates every
    blog page without touching the functions.
  -->
  <body class="blog-page-body">
    <nav class="nav-wrap" aria-label="Primary">
      <div class="nav-pill" data-nav-menu-root>
        <a class="brand" href="/" aria-label="LogicFolds home">
          <span class="brand-mark">LF</span>
          <span class="brand-word">LogicFolds</span>
        </a>
        <div class="nav-links" id="nav-menu">
          <a href="/#services">Services</a>
          <a href="/#work">Work</a>
          <a class="current" href="/blog/">Blog</a>
          <a href="/opportunity-sprint/">Support Sprint</a>
          <a href="/LogicFolds_Credentials.pdf" target="_blank" rel="noreferrer">Credentials</a>
        </div>
        <button
          class="nav-toggle"
          type="button"
          data-nav-toggle
          aria-expanded="false"
          aria-controls="nav-menu"
          aria-label="Open menu"
        >
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>
        <button class="nav-cta" type="button" data-open-booking>Start a project</button>
      </div>
    </nav>

    <main class="blog-main"></main>

    <footer class="blog-footer">
      <a href="/">LogicFolds</a>
      <span>Practical AI systems for business operations.</span>
    </footer>

    <dialog class="booking-dialog" id="booking-dialog" aria-labelledby="booking-title">
      <div class="booking-panel">
        <button class="booking-close" type="button" data-close-booking aria-label="Close booking form">x</button>
        <div class="booking-intro">
          <p class="eyebrow">Start a conversation</p>
          <h2 id="booking-title">What would you like to improve?</h2>
          <p>A short note is enough. We will arrange the call by email.</p>
        </div>

        <form class="booking-form" id="booking-form">
          <div class="form-grid">
            <label>
              <span>Name</span>
              <input name="name" type="text" autocomplete="name" required />
            </label>
            <label>
              <span>Work email</span>
              <input name="email" type="email" autocomplete="email" required />
            </label>
            <label>
              <span>Company <small>Optional</small></span>
              <input name="company" type="text" autocomplete="organization" />
            </label>
          </div>

          <label>
            <span>What would you like to improve?</span>
            <textarea
              name="message"
              rows="4"
              placeholder="A repeated process, delay, backlog, or quality problem..."
              required
            ></textarea>
          </label>

          <input name="service" type="hidden" value="LogicFolds blog inquiry" />
          <label class="honeypot" aria-hidden="true">
            <span>Leave this field empty</span>
            <input name="companyFax" type="text" tabindex="-1" autocomplete="off" />
          </label>

          <div class="booking-actions">
            <button class="button primary" type="submit">
              Send request
              <span class="arrow-dot">-&gt;</span>
            </button>
            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
          </div>
        </form>
      </div>
    </dialog>

    <script type="module" src="/src/article.js"></script>
  </body>
</html>
